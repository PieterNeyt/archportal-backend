stages:
  - compile
  - test
  - package

variables:
  DEFAULT_IMAGE: eclipse-temurin:25-jdk-alpine

# TODO cache dependencies in container
compile:
  stage: compile
  image: $DEFAULT_IMAGE
  script:
    - ./gradlew compileJava
    - ./gradlew compileTestJava
#  rules: 
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH

test:
  stage: test
  image: $DEFAULT_IMAGE
  artifacts:
    reports:
      junit:
        - build/test-results/test/TEST-*.xml
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - ./gradlew test
#  rules:
#    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH
    
package:
  stage: package
  image: registry.gitlab.com/kdg-ti/integratieproject-j3/teams-25-26/team15/archportal/archportalinfrastructure/java-docker:latest
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" 
    - docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - ./gradlew bootBuildImage --imageName=$CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:latest
#  rules: 
#    - if: $CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
