version: '3.9'

name: archPortal

services:
  # PostgreSQL database
  app_postgres:
    image: postgres:17.6-alpine
    restart: always
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres'
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5443:5432'
    networks:
      - backend
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d/

  # RabbitMQ
  app_rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    ports:
      - '5672:5672'   # AMQP
      - '15672:15672' # Management UI
    networks:
      - backend
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/log:/var/log/rabbitmq

  # Keycloak MySQL DB
  idp_mysql:
    image: mysql:9.0.1
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'keycloak'
      MYSQL_USER: 'keycloak'
      MYSQL_PASSWORD: 'password'
    ports:
      - '3307:3306'
    networks:
      - kc
    volumes:
      - ./idp_mysql_data:/var/lib/mysql

  # Keycloak
  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    environment:
      KEYCLOAK_ADMIN: 'admin'
      KEYCLOAK_ADMIN_PASSWORD: 'admin'
      KC_DB: 'mysql'
      KC_DB_URL_HOST: 'idp_mysql'
      KC_DB_URL_DATABASE: 'keycloak'
      KC_DB_USERNAME: 'keycloak'
      KC_DB_PASSWORD: 'password'
    command: start-dev
    ports:
      - '8180:8080'
    depends_on:
      - idp_mysql
    networks:
      - kc

  # Redis (Boardgame cache & session store)
  boardgame_redis:
    image: redis:7.2-alpine
    ports:
      - '6380:6379'
    networks:
      - backend
    volumes:
      - ./redis/data:/data

  # Platform Backend
  platform_backend:
    image: alpine:3.20 # TODO: replace with platform backend image
    depends_on:
      - app_postgres
      - app_rabbitmq
      - boardgame_redis
    networks:
      - backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  # Platform Frontend
  platform_frontend:
    image: nginx:stable-alpine # TODO: replace with platform frontend image
    ports:
      - '3000:80'
    networks:
      - backend
    depends_on:
      - platform_backend

  # TicTacToe Backend
  tictactoe_backend:
    image: alpine:3.20 # TODO: replace with tictactoe backend image
    depends_on:
      - boardgame_redis
      - app_rabbitmq
    networks:
      - backend

  # TicTacToe Frontend
  tictactoe_frontend:
    image: nginx:stable-alpine # TODO: replace with tictactoe frontend image
    ports:
      - '3001:80'
    networks:
      - backend
    depends_on:
      - tictactoe_backend

  # Checkers Backend
  checkers_backend:
    image: alpine:3.20 # TODO: replace with checkers backend image
    depends_on:
      - boardgame_redis
      - app_rabbitmq
    networks:
      - backend

  # Checkers Frontend
  checkers_frontend:
    image: nginx:stable-alpine # TODO: replace with checkers frontend image
    ports:
      - '3002:80'
    networks:
      - backend
    depends_on:
      - checkers_backend

  # Anti Corruption Layer
  anticorruptionlayer:
    image: alpine:3.20 # TODO: replace with ACL image
    networks:
      - backend
    depends_on:
      - platform_backend
      - tictactoe_backend
      - checkers_backend

networks:
  kc:
    name: kc-network
    driver: bridge
  backend:
    name: back-network
    driver: bridge
