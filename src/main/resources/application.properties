spring.application.name=ArchPortal

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/auth/realms/ArchPortal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/auth/realms/ArchPortal/protocol/openid-connect/certs

