spring.profiles.active=prod

spring.application.name=ArchPortal

spring.datasource.url=jdbc:postgresql://archportal-app_postgres-1:5432/postgres
spring.datasource.username=user
spring.datasource.password=password

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://archportal-idp_keycloak-1:8180/realms/ArchPortal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://archportal-idp_keycloak-1:8180/realms/ArchPortal/protocol/openid-connect/certs
keycloak-url=http://archportal-idp_keycloak-1:8180/realms/ArchPortal