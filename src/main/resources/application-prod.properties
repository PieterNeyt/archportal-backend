spring.jpa.hibernate.ddl-auto=create

#spring.sql.init.mode=never
#spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/game-service-data.sql

spring.datasource.url=jdbc:postgresql://archportal-app_postgres-1:5432/postgres
spring.datasource.username=user
spring.datasource.password=password

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/auth/realms/ArchPortal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://archportal-idp_keycloak-1:8080/auth/realms/ArchPortal/protocol/openid-connect/certs

mollie.redirect.url=http://localhost/payment-return