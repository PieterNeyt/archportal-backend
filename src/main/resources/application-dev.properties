spring.jpa.hibernate.ddl-auto=create-drop

spring.config.import=classpath:secret.properties

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/game-service-data.sql

spring.datasource.url=jdbc:postgresql://localhost:5443/postgres
spring.datasource.username=user
spring.datasource.password=password

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/auth/realms/ArchPortal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/auth/realms/ArchPortal/protocol/openid-connect/certs

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password